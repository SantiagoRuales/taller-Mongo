name: Pipeline CI/CD - DataOps (Terraform & Python)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-cd-dataops:
    name: Validación y Despliegue DataOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar pruebas y validación de código Python
        run: |
          echo "Buscando y validando scripts de Python en el repositorio..."
          find . -maxdepth 2 -name "*.py" -exec python -m py_compile {} +
          echo "✅ Pruebas de sintaxis Python superadas correctamente."

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verificar configuración IaC (main.tf)
        run: |
          if [ ! -f main.tf ]; then
            cat << 'EOF' > main.tf
          terraform {
            required_providers {
              local = {
                source  = "hashicorp/local"
                version = "~> 2.5"
              }
            }
          }

          resource "local_file" "dataops_metadata" {
            content  = "Infraestructura DataOps validada y desplegada via GitHub Actions CI/CD"
            filename = "${path.module}/dataops_status.txt"
          }
          EOF
          fi

      - name: Inicializar y validar Terraform (terraform init & validate)
        run: |
          terraform init
          terraform validate

      - name: Generar plan de infraestructura (terraform plan)
        run: terraform plan -input=false

      - name: Desplegar cambios (terraform apply)
        run: terraform apply -auto-approve -input=false
